services:
  db:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: explore_kh
      MARIADB_USER: explore
      MARIADB_PASSWORD: explore_dev
      MARIADB_ROOT_PASSWORD: root_dev
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    environment:
      APP_ENV: development
      HTTP_ADDR: ":8080"
      APP_TIMEZONE: Asia/Phnom_Penh
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: explore
      DB_PASSWORD: explore_dev
      DB_NAME: explore_kh
      RUN_MIGRATIONS: "true"
      MIGRATIONS_PATH: file://migrations
      CORS_ALLOWED_ORIGINS: "*"
      SEED_FILE: seeds/destinations.json
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  db_data:
